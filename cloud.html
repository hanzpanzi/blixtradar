<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>⚡ Blixtradar – Moln</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background:#0f172a; color:#f8fafc; text-align:center; padding:12px; margin:0; -webkit-tap-highlight-color:transparent; }
  .card { background:#1e293b; border-radius:20px; padding:18px; max-width:480px; margin:12px auto; box-shadow:0 10px 25px rgba(0,0,0,0.5); border:1px solid #334155; }
  h1 { color:#38bdf8; margin:0 0 4px; font-size:1.6em; }
  .label { color:#94a3b8; font-size:0.8em; text-transform:uppercase; letter-spacing:1.1px; }
  .dist { font-size:3.4em; font-weight:800; color:#fde047; text-shadow:0 0 20px rgba(253,224,71,0.55); }
  .dist.alarm { color:#ef4444; text-shadow:0 0 26px rgba(239,68,68,0.9); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; text-align:center; }
  .cell { background:#0f172a; border:1px solid #263449; border-radius:12px; padding:10px; }
  .val { font-size:1.5em; font-weight:700; }
  .small { color:#94a3b8; font-size:0.8em; margin-top:6px; }
  .status { background:#0f172a; padding:12px; border-radius:12px; font-weight:600; color:#4ade80; margin:14px 0 4px; border:1px solid #1e293b; word-break:break-word; }
  #updated { color:#64748b; font-size:0.75em; margin-top:10px; }
  .offline { color:#f87171 !important; }
  .chartbox { background:#0f172a; border:1px solid #263449; border-radius:12px; padding:10px; margin-top:12px; text-align:left; }
  canvas { width:100%; height:130px; display:block; }
  .legend { font-size:0.72em; color:#64748b; margin-top:4px; }
  @supports (padding:max(0px)) {
    body { padding-left:max(12px,env(safe-area-inset-left)); padding-right:max(12px,env(safe-area-inset-right)); padding-top:max(12px,env(safe-area-inset-top)); padding-bottom:max(12px,env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>⚡ Blixtradar</h1>
    <div class="small">Live via Adafruit IO · fungerar utanför hemmanätet</div>

    <div class="status" id="status">Hämtar data...</div>

    <div style="margin:10px 0;">
      <div class="label">Närmaste blixt</div>
      <div class="dist" id="dist">--</div>
    </div>

    <div class="grid">
      <div class="cell"><div class="label">Totalt antal</div><div class="val" id="count">-</div></div>
      <div class="cell"><div class="label">Senaste blixt</div><div class="val" id="lasttime" style="font-size:1.2em;">-</div></div>
      <div class="cell"><div class="label">Störningar</div><div class="val" id="disturb" style="color:#f87171;">-</div></div>
      <div class="cell"><div class="label">Brus</div><div class="val" id="noise" style="color:#fbbf24;">-</div></div>
    </div>

    <div class="small" id="lastevent" style="margin-top:12px;">-</div>
    <div id="updated">-</div>

    <div class="chartbox">
      <div class="label">Blixtrar per timme (24 h)</div>
      <canvas id="chartStrikes" width="600" height="260"></canvas>
      <div class="legend" id="strikeSum">-</div>
    </div>

    <div class="chartbox">
      <div class="label">Närmaste blixtens avstånd (24 h)</div>
      <canvas id="chartDist" width="600" height="260"></canvas>
      <div class="legend">Gul linje = avstånd i km · luckor = inga blixtar rapporterade (0)</div>
    </div>
  </div>

<script>
const AIO = 'https://io.adafruit.com/api/v2/hanzpanzi/feeds/blixtradar-';
const FEEDS = ['status','distance','count','lasttime','disturb','noise','lastevent'];

async function fetchFeed(name) {
  try {
    const r = await fetch(AIO + name);
    if (!r.ok) throw 0;
    const j = await r.json();
    return j.last_value;
  } catch { return null; }
}

async function fetchHistory(name, hours) {
  try {
    const r = await fetch(AIO + name + '/data.json?hours=' + hours);
    if (!r.ok) throw 0;
    return await r.json(); // [{value, created_epoch}, ...] nyast först
  } catch { return null; }
}

async function refresh() {
  const vals = {};
  await Promise.all(FEEDS.map(async f => { vals[f] = await fetchFeed(f); }));

  const any = Object.values(vals).some(v => v !== null);
  const st = document.getElementById('status');
  if (!any) {
    st.textContent = 'Ingen data från ESP32:n';
    st.classList.add('offline');
    return;
  }
  st.classList.remove('offline');

  st.textContent = vals.status ?? '-';
  const d = vals.distance;
  const distEl = document.getElementById('dist');
  if (d === null || d === undefined) { distEl.textContent = '--'; }
  else {
    const n = parseInt(d, 10);
    if (isNaN(n)) { distEl.textContent = '--'; }
    else {
      distEl.textContent = n === 0 ? '--' : (n + ' km');
      distEl.classList.toggle('alarm', n > 0 && n < 40);
    }
  }
  document.getElementById('count').textContent = vals.count ?? '-';
  document.getElementById('lasttime').textContent = vals.lasttime ?? '-';
  document.getElementById('disturb').textContent = vals.disturb ?? '-';
  document.getElementById('noise').textContent = vals.noise ?? '-';
  document.getElementById('lastevent').textContent = vals.lastevent ?? '';

  try {
    const j = await (await fetch(AIO + 'count')).json();
    const iso = j.updated_at.endsWith('Z') ? j.updated_at : j.updated_at + 'Z';
    const age = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
    document.getElementById('updated').textContent =
      'Uppdaterad ' + (age < 90 ? age + ' s sedan' : Math.round(age/60) + ' min sedan');
  } catch {}
}

// ---------- Diagram (ren canvas, inga bibliotek) ----------
function prepCanvas(cv) {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 300, h = 130;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}

function drawBars(cv, buckets) {
  const { ctx, w, h } = prepCanvas(cv);
  const padB = 18, padT = 10;
  const maxV = Math.max(1, ...buckets);
  const bw = w / 24;
  ctx.font = '9px system-ui';
  // rutnät
  ctx.strokeStyle = '#263449';
  ctx.beginPath(); ctx.moveTo(0, h - padB); ctx.lineTo(w, h - padB); ctx.stroke();
  // staplar
  buckets.forEach((v, i) => {
    const bh = v / maxV * (h - padB - padT);
    const x = i * bw + 1, y = h - padB - bh;
    ctx.fillStyle = v > 0 ? (i === 23 ? '#fbbf24' : '#38bdf8') : '#1e293b';
    ctx.fillRect(x, y, bw - 2, Math.max(v > 0 ? 2 : 1, bh));
  });
  // max-etikett + timmar
  ctx.fillStyle = '#64748b';
  ctx.fillText(String(maxV), 2, 9);
  for (let i = 0; i <= 24; i += 6) {
    const hh = new Date(Date.now() - (23 - i + 1) * 3600e3).getHours();
    ctx.fillText(String(hh).padStart(2, '0'), Math.min(w - 14, i * bw + 1), h - 5);
  }
}

function drawLine(cv, pts) {
  const { ctx, w, h } = prepCanvas(cv);
  const padB = 18, padT = 10, padR = 24;
  const valid = pts.filter(p => p.km !== null);
  ctx.font = '9px system-ui';
  ctx.strokeStyle = '#263449';
  ctx.beginPath(); ctx.moveTo(0, h - padB); ctx.lineTo(w, h - padB); ctx.stroke();
  if (valid.length < 2) {
    ctx.fillStyle = '#64748b';
    ctx.fillText('Inga blixtrörelser att visa', 8, h / 2);
    return;
  }
  const maxKm = Math.max(10, ...valid.map(p => p.km));
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const xOf = t => (t - t0) / Math.max(1, t1 - t0) * (w - padR);
  const yOf = km => h - padB - (km / maxKm) * (h - padB - padT);
  // linje med luckor
  ctx.strokeStyle = '#fde047'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  let pen = false;
  pts.forEach(p => {
    if (p.km === null) { pen = false; return; }
    const x = xOf(p.t), y = yOf(p.km);
    if (!pen) { ctx.moveTo(x, y); pen = true; } else ctx.lineTo(x, y);
  });
  ctx.stroke();
  // max-etikett + timmar
  ctx.fillStyle = '#64748b'; ctx.lineWidth = 1;
  ctx.fillText(maxKm + ' km', 2, 9);
  for (let i = 0; i <= 24; i += 6) {
    const hh = new Date(Date.now() - (23 - i + 1) * 3600e3).getHours();
    ctx.fillText(String(hh).padStart(2, '0'), Math.min(w - 14, i * (w / 24) + 1), h - 5);
  }
}

async function refreshCharts() {
  const [cnt, dist] = await Promise.all([fetchHistory('count', 24), fetchHistory('distance', 24)]);
  // Blixtrar per timme: delta på kumulativ räknare (hanterar omstart = lägre värde)
  if (Array.isArray(cnt) && cnt.length > 1) {
    const old2new = cnt.slice().reverse(); // äldst först
    const buckets = new Array(24).fill(0);
    const now = Date.now();
    for (let i = 1; i < old2new.length; i++) {
      const v0 = parseFloat(old2new[i-1].value), v1 = parseFloat(old2new[i].value);
      if (isNaN(v0) || isNaN(v1)) continue;
      const delta = v1 >= v0 ? v1 - v0 : v1; // omstart: räkna nyvärdet
      if (delta <= 0) continue;
      const ageH = (now - old2new[i].created_epoch * 1000) / 3600e3;
      const b = 23 - Math.min(23, Math.floor(ageH));
      if (b >= 0 && b < 24) buckets[b] += delta;
    }
    drawBars(document.getElementById('chartStrikes'), buckets);
    const sum = buckets.reduce((a, b) => a + b, 0);
    document.getElementById('strikeSum').textContent = sum + ' blixtrar senaste 24 h';
  }
  // Avståndslinje
  if (Array.isArray(dist) && dist.length > 1) {
    const old2new = dist.slice().reverse();
    const pts = old2new.map(p => {
      const km = parseFloat(p.value);
      return { t: p.created_epoch * 1000, km: (isNaN(km) || km === 0) ? null : km };
    });
    drawLine(document.getElementById('chartDist'), pts);
  }
}

refresh();
refreshCharts();
setInterval(refresh, 30000);
setInterval(refreshCharts, 300000); // historik räcker var 5:e minut
</script>
</body>
</html>
